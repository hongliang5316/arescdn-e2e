# AresCDN 功能测试源站
#   8081: 主源站(测试域名的回源地址)
#   8082: 模拟内网"第三方"地址, 用于验证 302 跟随的内网拦截
worker_processes 1;
error_log /logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    lua_shared_dict seq 1m;

    log_format main '$time_iso8601 $remote_addr $server_port "$host" "$request" $status $body_bytes_sent '
                    'range="$http_range" cookie="$http_cookie" auth="$http_authorization" '
                    'xff="$http_x_forwarded_for"';
    access_log /logs/access.log main;

    absolute_redirect off;
    server_tokens off;
    default_type text/plain;

    # 每个响应带全局递增序号: 同一个 URL 两次响应序号相同, 说明第二次来自 CDN 缓存
    header_filter_by_lua_block {
        ngx.header["X-Origin-Seq"] = ngx.ctx.seq or ngx.shared.seq:incr("n", 1, 0)
        ngx.header["X-Origin-Port"] = ngx.var.server_port
    }

    server {
        listen 8081;

        location = / {
            return 200 "arescdn origin-test ok\n";
        }

        # 静态文件: /data/static/*
        location /static/ {
            root /data;
        }

        # 动态内容: body 里带序号, 按缓存规则缓存(/dyn/)或不缓存(/nocache/)
        location ~ ^/(dyn|nocache)/ {
            content_by_lua_block {
                local seq = ngx.shared.seq:incr("n", 1, 0)
                ngx.ctx.seq = seq
                ngx.say("dyn uri=", ngx.var.request_uri, " seq=", seq, " host=", ngx.var.http_host)
            }
        }

        # 回显请求信息
        location = /echo {
            content_by_lua_block {
                local cjson = require("cjson")
                local seq = ngx.shared.seq:incr("n", 1, 0)
                ngx.ctx.seq = seq
                ngx.say(cjson.encode({
                    seq = seq,
                    method = ngx.req.get_method(),
                    uri = ngx.var.request_uri,
                    host = ngx.var.http_host,
                    cookie = ngx.var.http_cookie,
                    authorization = ngx.var.http_authorization,
                    range = ngx.var.http_range,
                    xff = ngx.var.http_x_forwarded_for,
                    remote = ngx.var.remote_addr,
                }))
            }
        }

        # ---------- 302 跟随场景 ----------
        location = /302/rel         { return 302 /dyn/rel-final; }
        location = /302/abs-self    { return 302 http://$host/dyn/abs-self-final; }
        location = /302/to-echo     { return 302 /echo; }
        location = /302/loop        { return 302 /302/loop; }
        location = /302/third-private { return 302 http://$server_addr:8082/dyn/third; }
        location = /302/third-public  { return 302 http://httpbin.org/headers; }

        location = /302/none {
            content_by_lua_block {
                ngx.status = 302
                ngx.say("302 without location")
            }
        }

        # /302/chain/N: 连续 N 次 302, 最终到 /dyn/chain-final
        location ~ ^/302/chain/(\d+)$ {
            set $n $1;
            content_by_lua_block {
                local n = tonumber(ngx.var.n)
                if n > 1 then
                    return ngx.redirect("/302/chain/" .. (n - 1), 302)
                end
                return ngx.redirect("/dyn/chain-final", 302)
            }
        }

        # 其它 3xx 不应被跟随
        location = /301/rel { return 301 /dyn/301-final; }
        location = /307/rel { return 307 /dyn/307-final; }

        # ---------- 分片场景 ----------
        # 不支持 Range 的静态文件(Range 请求也返回 200 整文件)
        location /norange/ {
            alias /data/static/;
            max_ranges 0;
        }

        # 不在 CDN 缓存规则里、也不返回 Cache-Control 的静态文件: 不缓存
        location /nc/ {
            alias /data/static/;
        }

        location /nc-norange/ {
            alias /data/static/;
            max_ranges 0;
        }

        # 分片 + 302 跟随
        location = /302/big         { return 302 /static/10m.bin; }
        location = /302/big-abs     { return 302 http://$host/static/10m.bin; }
        location = /302/big-404     { return 302 /static/not-exist.bin; }
        location = /302/norange     { return 302 /norange/10m.bin; }
        location = /302/third-range { return 302 http://httpbin.org/range/102400; }
        # 外网第三方大文件: Ubuntu 24.04 发布时的 deb, 支持期内不会变化
        location = /302/third-big {
            return 302 http://mirrors.aliyun.com/ubuntu/pool/main/v/vim/vim-runtime_9.1.0016-1ubuntu7_all.deb;
        }

        # /302/big-chain/N: 连续 N 次 302, 最终到 /static/10m.bin
        location ~ ^/302/big-chain/(\d+)$ {
            set $n $1;
            content_by_lua_block {
                local n = tonumber(ngx.var.n)
                if n > 1 then
                    return ngx.redirect("/302/big-chain/" .. (n - 1), 302)
                end
                return ngx.redirect("/static/10m.bin", 302)
            }
        }

        # 每次交替跳到大小相同、内容不同的两个文件, 用于检查分片之间的一致性
        location = /302/flip {
            content_by_lua_block {
                local n = ngx.shared.seq:incr("flip", 1, 0)
                return ngx.redirect(n % 2 == 1 and "/static/shard/flip-a.bin" or "/static/shard/flip-b.bin", 302)
            }
        }
    }

    server {
        listen 8082;

        location / {
            return 200 "third-party 8082 uri=$request_uri\n";
        }
    }
}
